{% extends "base.html" %}

{% block title %}注册 - 我的个人博客{% endblock %}

{% block content %}

<div class="form-card">

    <div class="page-header">
        <div>
            <h1>注册账号</h1>
            <p>创建账号，开始记录你的学习与生活。</p>
        </div>
    </div>

    <form method="post">

        <div class="form-group">
            <label for="username">用户名</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="请输入用户名"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">密码</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="请输入密码"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">邮箱</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="请输入邮箱"
                required
            >
        </div>

        <div class="form-actions">

            <button type="submit" class="btn">
                注册
            </button>

            <a href="/login" class="btn-secondary">
                已有账号？登录
            </a>

        </div>

    </form>

</div>

{% endblock %}
