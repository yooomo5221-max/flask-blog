{% extends "base.html" %}

{% block title %}编辑文章 - 我的个人博客{% endblock %}

{% block content %}

<div class="form-card">

    <h1>编辑文章</h1>

    <form method="post">

        <div class="form-group">
            <label for="title">文章标题</label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ article.title }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="content">文章内容</label>

            <textarea
                id="content"
                name="content"
                rows="15"
                required
            >{{ article.content }}</textarea>
        </div>

        <div class="form-actions">

            <button type="submit" class="btn">
                保存修改
            </button>

            <a
                href="/article/{{ article.id }}"
                class="cancel-link"
            >
                取消
            </a>

        </div>

    </form>

</div>

{% endblock %}
