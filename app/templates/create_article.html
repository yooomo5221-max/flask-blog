{% extends "base.html" %}

{% block title %}发布文章 - 我的个人博客{% endblock %}

{% block content %}

<div class="form-card">

    <div class="page-header">
        <div>
            <h1>发布文章</h1>
            <p>记录你的学习、生活和想法。</p>
        </div>
    </div>

    <form method="post">

        <div class="form-group">
            <label for="title">文章标题</label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="请输入文章标题"
                required
            >
        </div>


        <div class="form-group">
            <label for="content">文章内容</label>

            <textarea
                id="content"
                name="content"
                rows="16"
                placeholder="请输入文章内容..."
                required
            ></textarea>
        </div>


        <div class="form-actions">

            <button type="submit" class="btn">
                发布文章
            </button>

            <a href="/articles" class="btn-secondary">
                取消
            </a>

        </div>

    </form>

</div>

{% endblock %}
